name: Windows CI - Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Visual Studio environment
      uses: microsoft/setup-msbuild@v1

    - name: Setup vcpkg and install OpenSSL
      run: |
        git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
        cd C:\vcpkg
        .\bootstrap-vcpkg.bat
        .\vcpkg.exe install openssl:x64-windows

    - name: Restore NuGet packages
      run: nuget restore FileEncryptor.vcxproj -PackagesDirectory packages

    - name: Build (Release x64)
      run: |
        set VCPKG_ROOT=C:\vcpkg
        msbuild FileEncryptor.vcxproj /p:Configuration=Release /p:Platform=x64 \
          /p:AdditionalIncludeDirectories="C:\\vcpkg\\installed\\x64-windows\\include;%(AdditionalIncludeDirectories)" \
          /p:AdditionalLibraryDirectories="C:\\vcpkg\\installed\\x64-windows\\lib;%(AdditionalLibraryDirectories)" /m

    - name: Upload artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: FileEncryptor-artifact
        path: |
          **/x64/Release/*.exe
          **/Release/*.exe

# Note: using vcpkg to install OpenSSL on runner and passing include/lib dirs to MSBuild.
