name: Windows CI - Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Visual Studio environment
      uses: microsoft/setup-msbuild@v1

    # No NuGet dependencies (everything comes from Windows/VC++). Using the repo
    # build script keeps CI on the same path as local builds (GUI + CLI + installer).
    - name: Build (Release x64)
      shell: cmd
      run: build_setup.cmd

    - name: Verify artifacts
      shell: pwsh
      run: |
        $want = @('x64\Release\FileEncryptor.exe','x64\Release\enc.exe','x64\Release\FileEncryptorSetup.exe')
        $missing = $want | Where-Object { -not (Test-Path $_) }
        if ($missing) { throw "Missing artifacts: $($missing -join ', ')" }
        Get-Item $want | Select-Object Name, Length | Format-Table -AutoSize | Out-String | Write-Host

    - name: Upload artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: FileEncryptor-artifact
        path: |
          **/x64/Release/*.exe
          **/Release/*.exe

# No third-party dependencies: cryptography is provided by the Windows CNG (bcrypt),
# so only the Visual Studio toolchain and the Windows SDK are required.