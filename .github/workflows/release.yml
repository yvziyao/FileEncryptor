name: Release - Build and publish

# 打 tag（v*）时自动构建三个产物并发布到 GitHub Releases；
# 也可以在 Actions 页面手动触发（workflow_dispatch）。
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v1.0.1. Fill it in to build AND publish a release; leave empty to only build artifacts.'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    # 统一的"本次发布的 tag"：打 tag 推送时用 ref_name，手动触发时用输入值。
    # 只有它形如 v* 才会发布 Release，否则只构建产物。
    env:
      REL_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v1

      # build_setup.cmd 会依次构建 GUI(MSBuild) -> CLI(cl) -> 安装程序(rc + cl)。
      # 它内部已经调用了 vcvars64.bat 定位工具链。
      - name: Build GUI + CLI + installer (Release x64)
        shell: cmd
        run: build_setup.cmd

      - name: Verify artifacts
        shell: pwsh
        run: |
          $want = @(
            'x64\Release\FileEncryptor.exe',
            'x64\Release\enc.exe',
            'x64\Release\FileEncryptorSetup.exe'
          )
          $missing = $want | Where-Object { -not (Test-Path $_) }
          if ($missing) { throw "Missing artifacts: $($missing -join ', ')" }
          Get-Item $want | Select-Object Name, Length | Format-Table -AutoSize | Out-String | Write-Host
          # 附带 sha256，方便用户核对（与程序内「检查更新」的比对口径一致）
          Get-FileHash $want -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $($_.Path)" } | Write-Host
          Get-FileHash $want -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content -Path x64\Release\SHA256SUMS.txt -Encoding ascii

      # MSIX（商店/侧载用）。Publisher 需先替换成 Partner Center 的发布者 ID，
      # 否则只能本地侧载、不能上架。
      # 包版本必须跟着 tag 走：Microsoft Store 会拒绝重复或低于已发布版本的包，
      # 写死 1.0.0.0 的话第二次提交必然失败。
      - name: Build MSIX
        shell: pwsh
        run: |
          $v = $env:REL_TAG -replace '^v', ''
          if ($v -notmatch '^\d+\.\d+\.\d+$') {
            Write-Host "tag 不是 vX.Y.Z 形式，MSIX 版本回退为 1.0.0.0"
            $v = '1.0.0'
          }
          ./msix/build_msix.ps1 -Version "$v.0"

      # 商店/侧载包的签名与结构自检（自签名证书不受信任是预期的，商店会重签）
      - name: Sanity-check MSIX
        shell: pwsh
        run: |
          $f = 'x64/msix/FileEncryptor.msix'
          if (-not (Test-Path $f)) { throw "MSIX was not produced" }
          Copy-Item $f 'x64/msix/pkg.zip'
          Expand-Archive 'x64/msix/pkg.zip' 'x64/msix/unpacked' -Force
          [xml]$m = Get-Content 'x64/msix/unpacked/AppxManifest.xml' -Raw
          $min = $m.Package.Dependencies.TargetDeviceFamily.MinVersion
          $ver = $m.Package.Identity.Version
          Write-Host "manifest Identity/@Version = $ver ; MinVersion = $min"
          if ([version]$min -le [version]'10.0.17134.0') { throw "MinVersion $min is rejected by the Store" }
          foreach ($a in @('Assets/StoreLogo.png','Assets/Square44x44Logo.png','Assets/Square150x150Logo.png')) {
            if (-not (Test-Path "x64/msix/unpacked/$a")) { throw "missing asset $a" }
          }
          Write-Host "MSIX layout OK"

      # 每次都上传 build artifact：手动触发时没有 tag 也能拿到产物
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FileEncryptor-Release-x64
          path: |
            x64/Release/FileEncryptor.exe
            x64/Release/enc.exe
            x64/Release/FileEncryptorSetup.exe
            x64/Release/SHA256SUMS.txt
            x64/msix/FileEncryptor.msix
          if-no-files-found: error

      # 从 CHANGELOG.md 里取本次 tag 对应的章节作为发行说明
      - name: Extract release notes
        if: startsWith(env.REL_TAG, 'v')
        shell: pwsh
        run: |
          $tag = $env:REL_TAG
          if (-not (Test-Path CHANGELOG.md)) { "本版说明见 CHANGELOG.md" | Set-Content RELEASE_BODY.md -Encoding UTF8; exit 0 }
          $cl = Get-Content CHANGELOG.md -Raw -Encoding UTF8
          $pattern = '(?ms)^##\s+' + [regex]::Escape($tag) + '\b.*?(?=^##\s|\z)'
          $m = [regex]::Match($cl, $pattern)
          if ($m.Success) {
            Write-Host "已从 CHANGELOG 取到 $tag 的说明"
            $m.Value.Trim() | Set-Content RELEASE_BODY.md -Encoding UTF8
          } else {
            Write-Warning "CHANGELOG.md 里没有 $tag 章节，使用占位说明"
            "本版说明见 CHANGELOG.md" | Set-Content RELEASE_BODY.md -Encoding UTF8
          }

      # 同步到 Gitee（主渠道）。需要仓库 Secrets 里配置 GITEE_TOKEN；
      # 没配就自动跳过，continue-on-error 保证 Gitee 出问题不会影响 GitHub 发布。
      - name: Mirror to Gitee
        if: startsWith(env.REL_TAG, 'v')
        continue-on-error: true
        shell: pwsh
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: ./scripts/gitee_release.ps1 -Tag $env:REL_TAG -BodyFile RELEASE_BODY.md

      # 打 tag 时发布 Release（GitHub 只是镜像渠道，主渠道仍是 Gitee）
      - name: Publish GitHub Release
        if: startsWith(env.REL_TAG, 'v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.REL_TAG }}
          tag_name: ${{ env.REL_TAG }}
          # 手动触发时 tag 可能还不存在，让 action 在当前提交上创建它
          target_commitish: ${{ github.sha }}
          draft: false
          # 发行说明取 CHANGELOG.md 对应章节
          body_path: RELEASE_BODY.md
          # MSIX 不放进 Release：本地自签名证书不受信任，
          # 直接下载安装会报签名错误。商店提交用 Actions 里的 artifact。
          files: |
            x64/Release/FileEncryptor.exe
            x64/Release/enc.exe
            x64/Release/FileEncryptorSetup.exe
            x64/Release/SHA256SUMS.txt
