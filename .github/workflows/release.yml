name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1

    - name: Setup vcpkg and install OpenSSL
      run: |
        git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
        cd C:\vcpkg
        .\bootstrap-vcpkg.bat
        .\vcpkg.exe install openssl:x64-windows

    - name: Restore NuGet packages
      run: nuget restore FileEncryptor.vcxproj -PackagesDirectory packages

    - name: Build (Release x64)
      shell: pwsh
      run: |
        $env:VCPKG_ROOT = 'C:\vcpkg'
        msbuild "FileEncryptor.vcxproj" /p:Configuration=Release /p:Platform=x64 /p:AdditionalIncludeDirectories='C:\vcpkg\installed\x64-windows\include;%(AdditionalIncludeDirectories)' /p:AdditionalLibraryDirectories='C:\vcpkg\installed\x64-windows\lib;%(AdditionalLibraryDirectories)' /m

    - name: Create GitHub Release and upload artifact
      uses: softprops/action-gh-release@v1
      with:
        files: "**/x64/Release/*.exe,**/Release/*.exe"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
